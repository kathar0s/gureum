name: CI
on:
  push:
  pull_request:
  merge_group:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          check_together: 'yes'
          scandir: 'tools'
  swift-format:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      - run: swift format lint --strict --recursive OSXCore OSX GureumTests Preferences OSXTestApp
  build-and-test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - run: xcodebuild -version
      - name: Build and test without release-signing credentials
        run: >-
          xcodebuild -project Gureum.xcodeproj -scheme OSX -sdk macosx
          -destination 'platform=macOS' test
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      #- uses: sersoft-gmbh/xcodebuild-action@v4
